name: Publish marketplace

# Builds the Community Marketplace plugin and publishes manifest.json and plugin.js to the
# marketplace branch, so Buzz can install it from Git without a local build.
on:
  push:
    branches: [main]
    paths:
      - marketplace/**
      - .github/workflows/publish-marketplace.yml
  workflow_dispatch:

concurrency:
  group: publish-marketplace
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        working-directory: marketplace
        run: corepack enable && pnpm install --frozen-lockfile && pnpm check

      - name: Check out the marketplace branch
        run: |
          if git ls-remote --exit-code --heads origin marketplace >/dev/null; then
            git fetch --depth=1 origin marketplace
            git worktree add publish FETCH_HEAD
            git -C publish switch -c marketplace
          else
            git worktree add --orphan -b marketplace publish
          fi

      - name: Publish
        run: |
          cp marketplace/dist/manifest.json marketplace/dist/plugin.js publish/
          cd publish
          git add manifest.json plugin.js
          if git diff --cached --quiet; then
            echo "Build unchanged; nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Marketplace from ${GITHUB_SHA::7}"
          git push origin marketplace
